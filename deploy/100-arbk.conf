<VirtualHost *:80>
    ServerName arbk.kryeqyteti.net
    DocumentRoot /cloudclusters/arbk/public

    <Directory /cloudclusters/arbk/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
        SetOutputFilter DEFLATE
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/var/run/php/php8.1-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/arbk-error.log
    CustomLog ${APACHE_LOG_DIR}/arbk-access.log combined
</VirtualHost>
